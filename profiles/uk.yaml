# United Kingdom deployment (England and Wales). Values come from research/uk2/* and its verification
# reports; rationale and claim IDs: docs/uk/02-uk-profile-rationale.md and docs/uk/03-claims-ledger.md.
# Not legal advice: a UK solicitor must review legal.*, retention.* and the DPA before go-live.
extends: base
description: United Kingdom (GBP, VAT-basis aware quotes, working-day lead times, company details on outbound email, UK GDPR/PECR)
locale:
  region: GB
  language: en-GB
  timezone: Europe/London
  date_format: "%d/%m/%Y"
  working_week: [0, 1, 2, 3, 4]
  holidays:  # BEGIN gov.uk bank holidays (england-and-wales); generated by scripts/update_bank_holidays.py
    - 2026-01-01  # New Year’s Day
    - 2026-04-03  # Good Friday
    - 2026-04-06  # Easter Monday
    - 2026-05-04  # Early May bank holiday
    - 2026-05-25  # Spring bank holiday
    - 2026-08-31  # Summer bank holiday
    - 2026-12-25  # Christmas Day
    - 2026-12-28  # Boxing Day (Substitute day)
    - 2027-01-01  # New Year’s Day
    - 2027-03-26  # Good Friday
    - 2027-03-29  # Easter Monday
    - 2027-05-03  # Early May bank holiday
    - 2027-05-31  # Spring bank holiday
    - 2027-08-30  # Summer bank holiday
    - 2027-12-27  # Christmas Day (Substitute day)
    - 2027-12-28  # Boxing Day (Substitute day)
    - 2028-01-03  # New Year’s Day (Substitute day)
    - 2028-04-14  # Good Friday
    - 2028-04-17  # Easter Monday
    - 2028-05-01  # Early May bank holiday
    - 2028-05-29  # Spring bank holiday
    - 2028-08-28  # Summer bank holiday
    - 2028-12-25  # Christmas Day
    - 2028-12-26  # Boxing Day
    # END gov.uk bank holidays
money:
  base_currency: GBP
  accepted_currencies: [GBP, EUR, USD]
  symbol_map: { "£": GBP, "€": EUR, "US$": USD }
  bare_dollar_currency: null      # a bare "$" is ambiguous in UK quotes: never assumed
  assumed_currency: flag_require_approval
tax:
  name: VAT
  standard_rate: "0.20"           # UK standard rate; confirm before each tax year
  quote_basis_default: ex_tax     # market norm for display: suppliers' own terms say ex-VAT (RS, Farnell, Wurth, Hayley), but Toolstation includes VAT (UK-ACC-05)
  unknown_basis: flag_require_approval   # an unstated VAT basis is treated as unknown and sent to a human; the legal position for a price silent on VAT is unsettled (UK-CTL-04), so no basis is assumed either way
  ask_basis_in_rfq: true          # the RFQ asks the supplier to state whether its price includes VAT
lead_time: { default_unit: working_days }   # bare "days" are read as working days and flagged; supplier cut-offs vary from 12:00 to 21:00, standard weekday 16:30-21:00 (UK-ACC-03)
legal:
  jurisdiction: England and Wales (UK)
  contact_data_regime: "UK GDPR (as amended by the Data (Use and Access) Act 2025), Data Protection Act 2018, PECR; regulator: Information Commission (ICO); consult a UK solicitor"
  disclosure_footer: "Prepared with an AI assistant on behalf of {buyer}. It cannot accept terms or place orders; only a purchase order from {buyer} binds."
  notices:
    - "RFQs are transactional business requests and carry no promotion. The product must not be used for marketing email (PECR); a solicitor should confirm that RFQs fall outside the PECR marketing rules."
    - "A quote that does not state whether VAT is included is treated as unknown and sent to a human for approval. The legal position for a price that is silent on VAT is unsettled, so confirm the basis with the supplier. The construction reverse charge is not determined by the product."
    - "CE, UKCA and authenticity status are supplier-declared and not verified by the product; a missing mark means \"not stated\", not \"non-compliant\"."
    - "A UK company's business emails and order documents should show its registered name, number, registered office and UK part of registration (SI 2015/17). The company-details lines carry them, and sending stops if a tenant has not supplied them."
    - "Supplier-contact data sent to a processor outside the UK needs a transfer mechanism (a UK-US data bridge participant, or the IDTA or UK Addendum with a transfer risk assessment). The regulator is the Information Commission (ICO)."
  # Company particulars on business letters and order forms, including in electronic form (Companies Act
  # 2006 s.82; SI 2015/17 regs 24-25 and 29; research/uk2/verify/V6). Whether an RFQ email counts as a
  # business letter is a solicitor question (docs/architecture/known-gaps.md). The values are per-tenant
  # deployment settings, never profile data. This only ADDS a requirement; the R8 footer is unchanged.
  business_identity:
    required: true
    fields: [legal_name, registration_number, registered_office, registered_in]
    labels:
      legal_name: Company name
      registration_number: Company number
      registered_office: Registered office
      registered_in: Registered in
retention:
  raw_email_days: 90
  po_records_years: 6             # VAT records: at least 6 years (VAT Notice 700/21, UK-CTL-05); confirm with an accountant
  audit_years: 6
approvals: { threshold: "500" }   # placeholder in GBP, not derived from UK data; set per customer
parts: { enabled_families: [deep_groove_ball_bearing, v_belt], standards: ["ISO 15"] }
billing: { currency: GBP, prices_include_tax: false }
ui: { language: en-GB }
features: { photo_intake: false, phone_sms_scripts: true, down_now_mode: true }
