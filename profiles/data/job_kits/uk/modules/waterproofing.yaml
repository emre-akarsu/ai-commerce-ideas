- id: wp_tanking_kit
  description: Liquid tanking kit for shower walls (and floor in a wet room)
  spec: Liquid tanking kit with primer and reinforcing tape
  help: 'The kit must be tested to BS EN 14891: confirm on the data sheet. Its coverage in m2
    depends on the area to be tanked.'
  unit: kit
  quantity: ceil(tanked_m2 / tanking_kit_coverage_m2)
  provenance:
