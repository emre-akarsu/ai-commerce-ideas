    evidence_quality: search_snippet
  forced_by:
    text: BS 5385-1:2018 recommends a proprietary tanking system in showers and wet rooms; water-resistant
      adhesive or grout is not a substitute. There is no compliant budget option.
    source:
      source_title: 'Instarmac: tanking kits made compulsory in latest British Standard (BS 5385-1:2018,
