- id: wp_backer_board
  description: Tile backer board on wet walls
  spec: Cement fibre tile backer board, 12 mm, 1200 x 800 mm
  unit: nr
  quantity: backer_boards
  uniclass_pr:
    code: Pr_25_71_11
    title: Cement boards and sheets
    version: Pr v1.43 (July 2026)
  provenance:
  - source_title: Walsall Council DFG specification, adapted bathroom - low level tray (Feb 2015)
    url: https://go.walsall.gov.uk/sites/default/files/2022-08/specification_for_dfg_low_level_tray-3.pdf
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
  - source_title: 'Wickes how-to guide: tiling a wall'
    url: https://www.wickes.co.uk/how-to-guides/tiling/tile-a-wall
    licence: all-rights-reserved-facts-only
    evidence_quality: retailer
  - source_title: TilersForums thread quoting Hardiebacker fixing guidance
    url: https://www.tilersforums.com/threads/hardie-backer-board-info.48531
    licence: unknown-copyright-facts-only
    evidence_quality: forum
  forced_by:
    text: No gypsum plasterboard or plaster as the tile substrate in a wet room or power-shower bathroom,
      and no magnesium oxide boards (NHBC 9.2/06; binding on NHBC new homes, used here as good practice).
    source:
      source_title: Schluter Systems NHBC guidance summary (UK)
      url: https://eu.schluter.com/statics/www_schlueter_gb_2x/downloads/cumulus/D00460_Schlueter_Systems_NHBC_Guidance_UK.pdf
      licence: manufacturer-doc-facts-only
      evidence_quality: manufacturer_doc
  help: Insulated (XPS) boards are lighter and widely used; this kit counts 1200 x 800 mm boards, so
    a different board size needs the count changed. Insulated boards are accepted once a person
    approves them. 12 mm is the default thickness.
- id: wp_backer_screws
  description: Backer board screws and washers
  spec: 4.2 x 40 mm corrosion-resistant backer board screws with washers
  help: Sized for 12 mm backer board.
  unit: nr
  quantity: backer_boards * backer_screws_per_board
  provenance:
  - source_title: TilersForums thread quoting Hardiebacker fixing guidance
    url: https://www.tilersforums.com/threads/hardie-backer-board-info.48531
    licence: unknown-copyright-facts-only
    evidence_quality: forum
  - source_title: TilersForums thread quoting Marmox fixing guidance
    url: https://tilersforums.com/threads/marmox-information.48611
    licence: unknown-copyright-facts-only
    evidence_quality: forum
  forced_by:
    text: 'Use the board maker''s own screws and washers: the whole system must be proven waterproof,
      not just the board.'
    source:
      source_title: 'Architects Datafile: backer board maker on NHBC 9.2/06 (proven waterproof system)'
      url: https://architectsdatafile.co.uk/?p=354916
      licence: unknown-copyright-facts-only
      evidence_quality: public_spec
