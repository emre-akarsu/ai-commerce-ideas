rules:
- id: underfloor_heating_on_tiles
  when: add_underfloor_heating and floor_finish == 'tiled'
  requires:
  - ex_ufh_mat
  - ex_ufh_thermostat
  - ex_ufh_connection
  - tl_floor_tiles
  - tl_floor_adhesive
  - tl_floor_grout
  excludes:
  - fl_safety_vinyl
  rationale: Electric underfloor heating goes under tiles in flexible adhesive and grout, with a thermostat
    and an electrician.
  provenance:
  - source_title: Trade2Base bathroom flooring options and pricing (8 June 2026)
    url: https://www.trade2base.com/blog/bathroom-flooring-options-pricing-uk
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: 'Weber: tiling plywood (S1 up to 400 x 400, S2 above)'
    url: https://www.uk.weber/tile-fixing/tiling-plywood
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  - source_title: Approved Document P 2013 (electrical safety, dwellings)
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/441872/BR_PDF_AD_P_2013.pdf
    licence: OGL-3.0-unconfirmed
    evidence_quality: standard
- id: led_mirror_replaces_shaver_socket
  when: add_led_mirror
  requires:
  - ex_led_mirror
  - ex_led_mirror_connection
  excludes:
  - el_shaver_socket
  rationale: The LED mirror has its own shaver socket, so no separate socket is fitted; the mirror needs
    an electrician.
