rules:
- id: joint_system_compression
  when: joint_system == 'compression'
  requires:
  - ff_fittings_compression
  excludes:
  - ff_fittings_push_fit
  - ff_fittings_solder
  - ff_flux
  rationale: Merchants split fittings by joint technology, so the kit carries one family only.
  provenance:
  - source_title: Toolstation plumbing category tree
    url: https://www.toolstation.com/plumbing/c3
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
- id: joint_system_push_fit
  when: joint_system == 'push_fit'
  requires:
  - ff_fittings_push_fit
  excludes:
  - ff_fittings_compression
  - ff_fittings_solder
  - ff_flux
  rationale: Merchants split fittings by joint technology, so the kit carries one family only.
  provenance:
  - source_title: Toolstation plumbing category tree
    url: https://www.toolstation.com/plumbing/c3
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
- id: joint_system_solder
  when: joint_system == 'solder'
  requires:
  - ff_fittings_solder
  - ff_flux
  excludes:
  - ff_fittings_compression
  - ff_fittings_push_fit
  rationale: Merchants split fittings by joint technology, so the kit carries one family only.
  provenance:
  - source_title: Toolstation plumbing category tree
    url: https://www.toolstation.com/plumbing/c3
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
