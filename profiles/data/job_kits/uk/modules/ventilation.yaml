rules:
- id: extractor_fan
  requires:
  - vn_fan
  - el_fan_isolator
  - el_fan_cable
  - vn_duct
  - vn_condensation_trap
  - vn_wall_or_roof_terminal
  rationale: The fan needs a local all-pole isolator (3 mm gap), 100 mm duct, an external terminal and
    a condensation trap. The source asks for the trap on moisture-laden ducted air; it is always included
    here and can be unticked on site. Rates come from parameters, not the template.
  provenance:
  - source_title: Vent-Axia Lo-Carbon Quadra installation instructions (CEF-hosted PDF)
    url: https://assets.cef.co.uk/downloads/pdg/vent_axia_439253_instructions/vent_axia_439253_instructions.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  - source_title: Approved Document F Vol 1, 2021 edition (ventilation), Table 1.1
    url: https://assets.publishing.service.gov.uk/media/61deba42d3bf7f054fcc243d/ADF1.pdf
    licence: OGL-3.0-unconfirmed
    evidence_quality: standard
