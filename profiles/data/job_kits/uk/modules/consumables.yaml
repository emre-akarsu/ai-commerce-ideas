    - premium
    default: false
    price_band:
      min: '15'
      max: '15'
      currency: GBP
      per: 300 ml cartridge
      vat: inc
      observed_on: '2026-10-06'
      basis: observed retail price, not verified
    provenance:
    - source_title: B&Q enhanced sanitary sealant 300 ml listing (Oct 2026)
      url: https://www.diy.com/departments/unibond-triple-protect-white-silicone-based-bathroom-kitchen-sanitary-sealant-300ml/1474147_BQ.prd
