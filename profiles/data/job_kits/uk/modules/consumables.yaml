- id: cs_sanitary_silicone
  description: Sanitary silicone sealant
  spec: Bathroom-grade white silicone sealant with fungicide
  unit: cartridge
  quantity: ceil(sealant_joint_m / sealant_m_per_cartridge)
  uniclass_pr:
    code: Pr_30_31_76_77
    title: Silicone construction joint sealants
    version: Pr v1.43 (July 2026)
  provenance:
  - source_title: 'Truly PVC: estimating silicone cartridge yield'
    url: https://www.trulypvc.com/blogs/how-to-guides/how-to-estimate-silicone-cartridge-yield
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: Bathroom specification - bathroom replacement for general needs dwellings, V1 24.11.2025
      (Sell2Wales tender attachment)
    url: https://www.sell2wales.gov.wales/Assets/NoticeBuilder_FileDownload.aspx?id=376193
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
  - source_title: Ideal Standard i.life Idealform bath fitting instructions
    url: https://heatandplumb.com/media/ideal-standard/fitting-instructions/file-512508.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  options:
  - id: own_brand
    label: Own-brand sanitary silicone
    spec: Sanitary silicone sealant with fungicide, white, 300 ml
    tags:
    - budget
    default: false
    provenance:
    - source_title: B&Q sanitary sealant 300 ml listing (Oct 2026)
      url: https://www.diy.com/departments/unibond-white-silicone-based-bathroom-kitchen-sanitary-sealant-300ml/1474132_BQ.prd
      licence: unknown-copyright-facts-only
      evidence_quality: retailer
  - id: anti_mould
    label: Branded anti-mould silicone
    spec: Anti-mould sanitary silicone sealant, white, 300 ml
    tags:
    - most_used
    default: true
    evidence_grade: C
    why_default: A branded anti-mould white silicone is the usual retail pick; no ranks were found.
    price_band:
      min: '9'
      max: '13'
      currency: GBP
      per: 300 ml cartridge
      vat: inc
      observed_on: '2026-10-06'
      basis: observed retail price, not verified
    provenance:
    - source_title: B&Q sanitary sealant 300 ml listing (Oct 2026)
      url: https://www.diy.com/departments/unibond-white-silicone-based-bathroom-kitchen-sanitary-sealant-300ml/1474132_BQ.prd
      licence: unknown-copyright-facts-only
