rules:
- id: wall_hung_wc
  when: wc_type == 'wall_hung'
  requires:
  - sw_wc_frame
  - sw_wc_flush_plate
  - sw_wc_pan_wall_hung
  - sw_wc_seat
  excludes:
  - sw_wc_pan_connector
  - sw_wc_pan_close_coupled
  - sw_wc_cistern
  rationale: A wall-hung WC needs a concealed frame, a flush plate and a wall-hung pan. The frames cited
    ship a 90 mm bend with a 90/110 mm adaptor, so a separate 110 mm pan connector is not added (this
    differs from the original brief). Plate must match the cistern maker and series; that compatibility
    is a SKU check, not encoded here.
  provenance:
  - source_title: Geberit UK catalogue, Duofix frame 111.300.00.5 scope of delivery (search snippet; page
      404 when fetched)
    url: https://catalog.geberit.co.uk/en-GB/product/PRO_100926
    licence: manufacturer-doc-facts-only
    evidence_quality: search_snippet
  - source_title: Grohe Rapid SL 3-in-1 set 3886020A component list (QS Supplies retailer page)
    url: https://qssupplies.co.uk/bathroom-furniture-shower-taps/321819.htm
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
- id: close_coupled_wc
  when: wc_type == 'close_coupled'
  requires:
  - sw_wc_pan_close_coupled
  - sw_wc_cistern
  - sw_wc_seat
  - sw_wc_flush_lever
  - ff_iv_wc
  excludes:
  - sw_wc_frame
  - sw_wc_flush_plate
  - sw_wc_pan_wall_hung
  rationale: A close-coupled suite is bought as pan, cistern, seat and lever, plus a pan connector chosen
    by the soil outlet and an isolating valve on the cistern feed.
  provenance:
  - source_title: Armitage Shanks Contour 21 close-coupled WC suite data sheet
    url: https://www.specifiedby.com/armitage-shanks/contour-21-close-coupled-wc-suite/armitage-shanks_Contour-21-Close-Coupled-WC-Suite_Specifications_DataSheet1.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  - source_title: 'Wickes how-to guide: installing a toilet'
    url: https://www.wickes.co.uk/how-to-guides/bathrooms/fit-a-toilet
    licence: all-rights-reserved-facts-only
    evidence_quality: retailer
  - source_title: Bathroom specification - bathroom replacement for general needs dwellings, V1 24.11.2025
      (Sell2Wales tender attachment)
    url: https://www.sell2wales.gov.wales/Assets/NoticeBuilder_FileDownload.aspx?id=376193
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
- id: back_to_wall_wc
  when: wc_type == 'back_to_wall'
  requires:
  - sw_wc_pan_back_to_wall
  - sw_wc_concealed_cistern
  - sw_wc_btw_unit
  - sw_wc_seat
  - ff_iv_wc
  excludes:
  - sw_wc_frame
  - sw_wc_flush_plate
  - sw_wc_pan_wall_hung
  - sw_wc_pan_close_coupled
  - sw_wc_cistern
  rationale: A back-to-wall WC needs its pan, a concealed cistern with a flush button, a unit or boxing
    to hide it, a seat and an isolating valve; no frame.
  provenance:
  - source_title: Wickes Siena bathroom range (close-coupled or back-to-wall pan, 500 mm basins)
    url: https://www.wickes.co.uk/bathroom/suites/siena
    licence: all-rights-reserved-facts-only
    evidence_quality: retailer
