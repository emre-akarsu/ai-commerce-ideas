- id: tl_wall_adhesive
  description: Wall tile adhesive
  spec: Cementitious tile adhesive for walls
  help: Standard-set adhesive is accepted once a person approves it.
  unit: kg
  quantity: ceil(wall_tiled_m2 * adhesive_kg_per_m2)
  uniclass_pr:
    code: Pr_20_31_02_89
    title: Tile adhesives
    version: Pr v1.43 (July 2026)
  etim_class:
    code: EC011707
    title: Tile adhesive
    version: ETIM 10.1
  provenance:
  - source_title: Mapei Keraflex Maxi S1 listing quoting the TDS consumption (retailer, secondary)
    url: https://www.skroutz.gr/s/12196759/Mapei-Keraflex-Maxi-S1-Klebstoff-Kacheln-23kg.html
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: 'Wickes how-to guide: tiling a wall'
    url: https://www.wickes.co.uk/how-to-guides/tiling/tile-a-wall
    licence: all-rights-reserved-facts-only
    evidence_quality: retailer
  forced_by: &id001
    text: Tiles over 300 x 300 mm, porcelain and floors need a cement powder adhesive, not a ready-mixed
      tub; timber floors and underfloor heating need flexible S1 (S2 over 400 x 400 mm).
    source:
      source_title: 'Topps Tiles knowledge base: which tile adhesive to use (search snippet; page 403
        on fetch)'
      url: https://www.toppstiles.co.uk/knowledge-base/what-tile-adhesive-to-use
      licence: unknown-copyright-facts-only
      evidence_quality: search_snippet
  options:
  - id: flexible_s1
    label: Flexible S1 powder
    spec: Flexible S1 cement powder tile adhesive, rapid set, 20 kg bag
    tags:
    - most_used
    default: true
    evidence_grade: B
    why_default: Flexible S1 powder is the default the rules allow, and the most-reviewed adhesive at
      one merchant (669 reviews).
    price_band:
      min: '19'
      max: '25'
      currency: GBP
      per: 20 kg bag
      vat: inc
      observed_on: '2026-10-06'
      basis: observed retail price, not verified
    provenance:
    - source_title: Wickes tile adhesives category (34 products, review counts, Oct 2026)
      url: https://www.wickes.co.uk/Products/Tiles/Tile-Adhesives/c/1000877
      licence: all-rights-reserved-facts-only
      evidence_quality: retailer
    - source_title: Wickes grey tile adhesive listings (search snippet, Oct 2026)
      url: https://www.wickes.co.uk/featured/mapei-grey-tile-adhesive
      licence: all-rights-reserved-facts-only
      evidence_quality: search_snippet
    - source_title: Pro Tiler Tools flexible S1 wall and floor adhesive listing
      url: https://www.protilertools.co.uk/product/bal-spf-s1-standard-setting-flexible-wall---floor-adhesive-white-20kg
      licence: unknown-copyright-facts-only
      evidence_quality: retailer
  - id: s2
    label: Highly flexible S2 powder
    spec: Highly flexible S2 or fibre-reinforced cement powder tile adhesive for walls, 20 kg bags
    tags:
    - premium
    default: false
    provenance:
    - source_title: 'Weber: tiling plywood (S1 up to 400 x 400, S2 above)'
      url: https://www.uk.weber/tile-fixing/tiling-plywood
      licence: manufacturer-doc-facts-only
      evidence_quality: manufacturer_doc
