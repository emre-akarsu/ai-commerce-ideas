lines:
- id: tl_wall_tiles
  description: Wall tiles
  spec: Ceramic or porcelain wall tiles, size per tile inputs
  unit: m2
  quantity: wall_tiled_m2 * (1 + tile_waste_factor)
  uniclass_pr:
    code: Pr_35_93_96_19
    title: Ceramic tiles
    version: Pr v1.43 (July 2026)
  provenance:
  - source_title: 'Wickes how-to guide: tiling a wall'
