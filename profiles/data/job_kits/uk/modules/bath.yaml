rules:
- id: bath
  requires:
  - sw_bath
  - sw_bath_panel
  - sw_bath_fixing_pack
  - sw_bath_battens
  - sw_bath_wall_floor_screws
  - sw_bath_waste_overflow
  - sw_bath_trap
  - sw_bath_taps
  - ff_iv_bath
  - cs_sanitary_silicone
  rationale: Bath makers sell panels and fixing packs separately and do not supply sealant, wall and floor
    screws or panel battens; the waste and overflow is fitted 'where supplied', so it is normally separate,
    with a 40 mm trap.
  provenance:
  - source_title: Ideal Standard i.life Idealform bath fitting instructions
    url: https://heatandplumb.com/media/ideal-standard/fitting-instructions/file-512508.pdf
    licence: manufacturer-doc-facts-only
