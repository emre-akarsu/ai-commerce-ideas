rules:
- id: basin
  requires:
  - sw_basin_waste
  - sw_basin_trap
  - sw_basin_taps
  - ff_iv_basin
  rationale: A basin needs a waste (slotted or unslotted to match its overflow), a 32 mm trap with a 75
    mm seal and isolating valves on its feeds.
  provenance:
  - source_title: McAlpine unslotted pop-up basin waste with bottle trap (Screwfix listing)
    url: https://www.screwfix.com/p/mcalpine-unslotted-pop-up-all-in-one-basin-waste-with-bottle-trap-white-32mm/229cl
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: McAlpine A10 bottle trap 32 mm x 75 mm (Travis Perkins listing)
    url: https://www.travisperkins.co.uk/mcalpine-a10-seal-bottle-trap-32mm-x-75mm/p/960845
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: Bathroom specification - bathroom replacement for general needs dwellings, V1 24.11.2025
      (Sell2Wales tender attachment)
    url: https://www.sell2wales.gov.wales/Assets/NoticeBuilder_FileDownload.aspx?id=376193
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
- id: basin_pedestal
  when: basin_mount == 'pedestal'
  requires:
  - sw_basin_pedestal
  excludes:
  - sw_basin_wall_hung
  rationale: Pedestal basin chosen.
  provenance:
  - source_title: Bathroom specification - bathroom replacement for general needs dwellings, V1 24.11.2025
      (Sell2Wales tender attachment)
    url: https://www.sell2wales.gov.wales/Assets/NoticeBuilder_FileDownload.aspx?id=376193
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
- id: basin_wall_hung
  when: basin_mount == 'wall_hung'
  requires:
  - sw_basin_wall_hung
  excludes:
  - sw_basin_pedestal
  rationale: Wall-hung basin chosen.
  provenance:
  - source_title: Walsall Council DFG specification, adapted bathroom - low level tray (Feb 2015)
    url: https://go.walsall.gov.uk/sites/default/files/2022-08/specification_for_dfg_low_level_tray-3.pdf
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
- id: wall_hung_basin_on_stud
  when: basin_mount == 'wall_hung' and wall_type == 'stud'
  requires:
  - cs_pattress
  - cs_fixings_stud
  rationale: A wall-hung basin on a stud wall needs backing for its fixings.
  provenance:
  - source_title: Approved Document M Vol 1, 2015 incl. 2016 amendments
    url: https://assets.publishing.service.gov.uk/media/5a7f8a82ed915d74e622b17b/BR_PDF_AD_M1_2015_with_2016_amendments_V3.pdf
    licence: OGL-3.0
    evidence_quality: standard
  - source_title: Mira Reflex bar valve installation guide 1196840-W2-C
    url: https://images.victorianplumbing.co.uk/products/mira-reflex-ev-thermostatic-shower-mixer-chrome-2-1744-020/instructions/21744020.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
- id: basin_vanity
  when: basin_mount == 'vanity'
  requires:
  - sw_basin_vanity
  excludes:
  - sw_basin_pedestal
  - sw_basin_wall_hung
  rationale: A vanity basin replaces the pedestal or wall-hung basin.
