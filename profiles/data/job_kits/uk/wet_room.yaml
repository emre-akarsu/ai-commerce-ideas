rules:
- id: wall_hung_wc
  when: wc_type == 'wall_hung'
  requires:
  - sw_wc_frame
  - sw_wc_flush_plate
  - sw_wc_pan_wall_hung
  - sw_wc_seat
  excludes:
  - sw_wc_pan_connector
  - sw_wc_pan_close_coupled
  - sw_wc_cistern
  rationale: A wall-hung WC needs a concealed frame, a flush plate and a wall-hung pan. The frames cited
    ship a 90 mm bend with a 90/110 mm adaptor, so a separate 110 mm pan connector is not added (this
    differs from the original brief). Plate must match the cistern maker and series; that compatibility
    is a SKU check, not encoded here.
  provenance:
  - source_title: Geberit UK catalogue, Duofix frame 111.300.00.5 scope of delivery (search snippet; page
      404 when fetched)
    url: https://catalog.geberit.co.uk/en-GB/product/PRO_100926
    licence: manufacturer-doc-facts-only
    evidence_quality: search_snippet
  - source_title: Grohe Rapid SL 3-in-1 set 3886020A component list (QS Supplies retailer page)
    url: https://qssupplies.co.uk/bathroom-furniture-shower-taps/321819.htm
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
- id: close_coupled_wc
  when: wc_type == 'close_coupled'
  requires:
  - sw_wc_pan_close_coupled
  - sw_wc_cistern
  - sw_wc_seat
  - sw_wc_flush_lever
  - ff_iv_wc
  excludes:
  - sw_wc_frame
  - sw_wc_flush_plate
  - sw_wc_pan_wall_hung
  rationale: A close-coupled suite is bought as pan, cistern, seat and lever, plus a pan connector chosen
    by the soil outlet and an isolating valve on the cistern feed.
  provenance:
  - source_title: Armitage Shanks Contour 21 close-coupled WC suite data sheet
    url: https://www.specifiedby.com/armitage-shanks/contour-21-close-coupled-wc-suite/armitage-shanks_Contour-21-Close-Coupled-WC-Suite_Specifications_DataSheet1.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  - source_title: 'Wickes how-to guide: installing a toilet'
    url: https://www.wickes.co.uk/how-to-guides/bathrooms/fit-a-toilet
    licence: all-rights-reserved-facts-only
    evidence_quality: retailer
  - source_title: Bathroom specification - bathroom replacement for general needs dwellings, V1 24.11.2025
      (Sell2Wales tender attachment)
    url: https://www.sell2wales.gov.wales/Assets/NoticeBuilder_FileDownload.aspx?id=376193
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
- id: basin
  requires:
  - sw_basin_waste
  - sw_basin_trap
  - sw_basin_taps
  - ff_iv_basin
  rationale: A basin needs a waste (slotted or unslotted to match its overflow), a 32 mm trap with a 75
    mm seal and isolating valves on its feeds.
  provenance:
  - source_title: McAlpine unslotted pop-up basin waste with bottle trap (Screwfix listing)
    url: https://www.screwfix.com/p/mcalpine-unslotted-pop-up-all-in-one-basin-waste-with-bottle-trap-white-32mm/229cl
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: McAlpine A10 bottle trap 32 mm x 75 mm (Travis Perkins listing)
    url: https://www.travisperkins.co.uk/mcalpine-a10-seal-bottle-trap-32mm-x-75mm/p/960845
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: Bathroom specification - bathroom replacement for general needs dwellings, V1 24.11.2025
      (Sell2Wales tender attachment)
    url: https://www.sell2wales.gov.wales/Assets/NoticeBuilder_FileDownload.aspx?id=376193
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
- id: electric_shower
  when: shower_type == 'electric'
  requires:
  - sh_electric_unit
  - el_shower_isolator
  - el_shower_rcbo
  - el_shower_cable
  - el_part_p_notification
  - ff_iv_shower_electric
  excludes:
  - sh_mixer_valve
  - ff_iv_shower_mixer
  uses_lookup:
    table: electric_shower_circuit
    key: shower_kw
  rationale: 'An electric shower needs a dedicated circuit: 45 A double-pole isolator (3 mm gap), 30 mA
    RCD protection, an MCB and cable sized from the kW lookup, a mains cold feed with an isolating valve,
    and notification (new circuit, special location).'
  provenance:
  - source_title: Triton T70Z electric shower installation guide
    url: https://showerspares.com/downloads/triton-t70z-electric-shower-7.5kw-white-sp7007z.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  - source_title: Triton Omnicare installation and operating instructions 2181515H
    url: https://www.independent4life.co.uk/media/mageworx/downloads/attachment/file/2/5/25327%20triton%20omnicare%20installation%20and%20operating%20instructions%202181515h.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  - source_title: Approved Document P 2013 (electrical safety, dwellings)
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/441872/BR_PDF_AD_P_2013.pdf
    licence: OGL-3.0-unconfirmed
    evidence_quality: standard
- id: mixer_shower
  when: shower_type == 'mixer'
  requires:
  - sh_mixer_valve
  - sh_riser_kit
  - ff_iv_shower_mixer
  - cs_thread_sealant
  excludes:
  - el_shower_isolator
  - el_shower_rcbo
  - el_shower_cable
  - sh_electric_unit
  rationale: A bar mixer needs isolating valves close to the valve, thread sealant (not supplied) and
    a riser kit when not bundled; no shower circuit.
  provenance:
  - source_title: Mira Reflex bar valve installation guide 1196840-W2-C
    url: https://images.victorianplumbing.co.uk/products/mira-reflex-ev-thermostatic-shower-mixer-chrome-2-1744-020/instructions/21744020.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  - source_title: Mira Discovery bar mixer installation guide
    url: https://www.showerspares.com/downloads/mira-discovery-bar-mixer-1609.001.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
  - source_title: Mira Atom ERD installation guide 1340912-W2-A (Feb 2018)
    url: https://media.wickes.co.uk/is/content/wickes/GPID_1100684411_TECH_0
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
- id: wet_room_drainage
  requires:
  - dr_former
  - dr_gully_trap
  - dr_waste_pipe
  - wp_tanking_kit
  rationale: An installed level-access shower is step-free with the floor laid to falls towards a gully
    connected to the drainage, inside a tanked wet room.
  provenance:
  - source_title: Approved Document M Vol 1, 2015 incl. 2016 amendments
    url: https://assets.publishing.service.gov.uk/media/5a7f8a82ed915d74e622b17b/BR_PDF_AD_M1_2015_with_2016_amendments_V3.pdf
    licence: OGL-3.0
