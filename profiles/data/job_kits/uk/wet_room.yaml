    url: https://www.north-norfolk.gov.uk/media/9723/advice-sheet-for-adapting-bathrooms.pdf
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
- id: rails_need_reinforcement
  requires:
  - ad_grab_rails
  - ad_wall_reinforcement
  rationale: Walls must carry grab rails and seats (1.5 kN/m2).
  provenance:
