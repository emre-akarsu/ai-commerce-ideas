    unit: mm
    description: Tile thickness.
    sample: '9'
  grout_joint_mm:
    unit: mm
    description: Grout joint width.
    sample: '3'
  adhesive_notch_mm:
    unit: mm
    description: Trowel notch depth.
    sample: '6'
  tile_trim_m:
    unit: m
    description: Length of exposed tile edges needing trim.
    sample: '5'
  paint_wall_m2:
    unit: m2
    description: Wall area to paint (untiled).
    sample: '14'
  paint_ceiling_m2:
    unit: m2
    description: Ceiling area to paint.
    sample: '4.5'
derived:
  partition_area_m2:
    formula: partition_length_m * partition_height_m * partition_faces
    unit: m2
    description: Board area of the new partition.
  partition_boards:
    formula: ceil(partition_area_m2 / plasterboard_sheet_area_m2)
    unit: nr
    description: Plasterboard sheets for the partition.
  partition_studs:
    formula: ceil(partition_length_m * 1000 / stud_centres_mm) + 1
    unit: nr
    description: 'Studs: length over centres plus one (openings and ends extra).'
  screws_per_board:
    formula: (ceil(plasterboard_sheet_width_mm / stud_centres_mm) + 1) * (ceil(plasterboard_sheet_height_mm
      / plasterboard_screw_centres_mm) + 1)
    unit: nr
    description: 'Screws per board: stud lines x fixings per stud line.'
  partition_joint_m:
    formula: partition_boards * board_joint_m_per_board
    unit: m
    description: Board joint length to tape and fill.
  adhesive_kg_per_m2:
    formula: adhesive_kg_per_m2_per_mm * adhesive_notch_mm * adhesive_bed_to_notch_ratio
    unit: kg/m2
    description: Adhesive consumption.
  grout_kg_per_m2:
    formula: grout_formula_constant * grout_joint_mm * tile_thickness_mm * (tile_length_cm + tile_width_cm)
      / (tile_length_cm * tile_width_cm)
    unit: kg/m2
    description: Grout consumption from the joint formula.
  sealant_m_per_cartridge:
    formula: sealant_cartridge_ml / (sealant_joint_width_mm * sealant_joint_depth_mm)
    unit: m
    description: Bead length per cartridge (ml / mm2 gives metres).
  paint_litres:
    formula: (paint_wall_m2 + paint_ceiling_m2) * (emulsion_finish_coats + emulsion_mist_coats) / emulsion_coverage_m2_per_l
    unit: l
    description: Emulsion litres (area x coats / spreading rate).
  backer_boards:
    formula: ceil(backer_board_m2 / backer_board_area_m2)
    unit: nr
    description: Tile backer boards.
