  wc_type:
    type: enum
    question: WC type?
    values:
    - close_coupled
    - wall_hung
    default: close_coupled
  shower_type:
    type: enum
    question: Shower type?
    values:
    - electric
    - mixer
    default: electric
  shower_kw:
    type: enum
    question: Electric shower rating in kW (selects the circuit lookup row; ignored for a mixer shower)?
    values:
    - '7.0'
    - '7.5'
    - '8.0'
    - '8.5'
    - '9.0'
    - '9.5'
    - '10.5'
    default: '9.5'
