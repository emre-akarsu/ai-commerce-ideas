description: 'Replace a bath with a level-access shower in a wet room: former and gully laid to falls,
  tanked floor and shower walls, slip-resistant floor, grab rails, WC and wall-hung basin. Structure follows
  one council DFG level-access specification; requirement items follow Approved Document M (M4(3) where
  it applies) and council OT guidance.'
