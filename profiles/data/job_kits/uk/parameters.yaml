# UK job-kit parameters
# synthetic/illustrative seed — not licensed data; tradesperson review required
# Generated content is plain data: edit it directly. Schema and licensing policy:
# profiles/data/job_kits/README.md. Checked by tests/profiles/test_job_kits.py.
# Line wording is our own. Brand names appear only in example_note fields. Provenance URLs are
# sources read in research_notes/UK refurbishment job templates data/ (2026-10-06).
id: uk.job_kit_parameters
version: 0.1.0
market: uk
label: synthetic/illustrative seed — not licensed data; tradesperson review required
status: needs_tradesperson_review
description: Market-specific constants used by the UK job-kit formulas. Templates reference these by name;
  nothing here is hard-coded in a formula. Values are Decimal strings with explicit units.
parameters:
  tile_waste_factor:
    value: '0.10'
    unit: ratio
    description: Cutting and breakage allowance added to tile area. Retailer advice only; no manufacturer
      source found, so it is a configurable parameter, not a cited constant.
    provenance:
    - source_title: 'Wickes how-to guide: tiling a wall'
      url: https://www.wickes.co.uk/how-to-guides/tiling/tile-a-wall
      licence: all-rights-reserved-facts-only
      evidence_quality: retailer
  adhesive_kg_per_m2_per_mm:
    value: '1.2'
    unit: kg/m2/mm
    description: 'Cementitious tile adhesive consumption per mm of bed thickness for one product (secondary
      source quoting the TDS). Product-specific: replace with the chosen product''s own figure.'
    provenance:
    - source_title: Mapei Keraflex Maxi S1 listing quoting the TDS consumption (retailer, secondary)
      url: https://www.skroutz.gr/s/12196759/Mapei-Keraflex-Maxi-S1-Klebstoff-Kacheln-23kg.html
      licence: unknown-copyright-facts-only
      evidence_quality: retailer
  adhesive_bed_to_notch_ratio:
    value: '0.5'
    unit: ratio
    description: Compressed bed thickness as a fraction of trowel notch depth.
    provenance:
    - source_title: Mapei Keraflex Maxi S1 listing quoting the TDS consumption (retailer, secondary)
      url: https://www.skroutz.gr/s/12196759/Mapei-Keraflex-Maxi-S1-Klebstoff-Kacheln-23kg.html
      licence: unknown-copyright-facts-only
      evidence_quality: derived
      derived_from: 'Research note on the adhesive row (software_formats_ratios.md): a combed bed is about
        half the notch depth after compression; check the product TDS.'
  grout_formula_constant:
    value: '0.18'
    unit: kg/m2 per (mm*mm*cm/cm2)
    description: Constant in C = k x joint width (mm) x tile thickness (mm) x (L+W)/(L x W) (L, W in cm);
      bundles grout density of about 1.8.
    provenance:
    - source_title: 'TilersForums: grout calculation formula attributed to the Weber TDS'
      url: https://tilersforums.com/threads/how-to-calculate-your-grout-requirements.39223
      licence: unknown-copyright-facts-only
      evidence_quality: forum
    - source_title: Weber weberjoint technical data sheet
      url: https://www.middleeast.weber/files/sodamco/2025-11/TDS_weberjoint-weberjoint_thick.pdf
      licence: manufacturer-doc-facts-only
      evidence_quality: manufacturer_doc
  primer_coverage_m2_per_l:
    value: '6'
    unit: m2/l
    description: Tile primer coverage (one product, New Zealand datasheet; UK product may differ).
    provenance:
    - source_title: Ardex Multiprime datasheet (New Zealand edition)
      url: https://ardex.co.nz/products/Tiling/Multiprime/Multiprime%20Datasheet%2012.10.20.pdf
      licence: manufacturer-doc-facts-only
      evidence_quality: manufacturer_doc
  sealant_cartridge_ml:
    value: '310'
    unit: ml
    description: Sealant cartridge volume used for yield.
    provenance:
    - source_title: 'Truly PVC: estimating silicone cartridge yield'
      url: https://www.trulypvc.com/blogs/how-to-guides/how-to-estimate-silicone-cartridge-yield
      licence: unknown-copyright-facts-only
      evidence_quality: retailer
  sealant_joint_width_mm:
    value: '10'
