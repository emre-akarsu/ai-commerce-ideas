# WC replacement
# synthetic/illustrative seed — not licensed data; tradesperson review required
# Generated content is plain data: edit it directly. Schema and licensing policy:
# profiles/data/job_kits/README.md. Checked by tests/profiles/test_job_kits.py.
# Line wording is our own. Brand names appear only in example_note fields. Provenance URLs are
# sources read in research_notes/UK refurbishment job templates data/ (2026-10-06).
id: uk.wc_replacement
version: 0.1.0
market: uk
title: WC replacement
label: synthetic/illustrative seed — not licensed data; tradesperson review required
status: needs_tradesperson_review
review:
  owner: null
  reviewed_by: null
  reviewed_on: null
  note: Not reviewed. A named owner and a UK tradesperson must review every line, quantity and rule before
    any customer use.
description: Replace one WC like for like (close-coupled) or with a wall-hung pan on a concealed frame.
  Separate WC replacement is its own line in council kitchen and bathroom programmes.
assumption_source: default_template
parameters_file: parameters.yaml
classification_attribution:
  uniclass: Uniclass 2015 © NBS, CC BY-ND 4.0 (https://uniclass.thenbs.com/download). Pr and Ss tables
    v1.43 (July 2026). Codes and titles are stored verbatim as checked live in the research notes; nothing
    is modified or extended.
  etim: ETIM 10.1, ETIM International, Open Data Commons Attribution Licence (ODC-By 1.0, http://opendatacommons.org/licenses/by/1.0/).
    Class codes and English titles via the buildingSMART Data Dictionary.
uniclass_ss:
- code: Ss_40_15_75_97
  title: WC systems
  version: Ss v1.43 (July 2026)
job_provenance:
- source_title: LB Hillingdon kitchen and bathroom replacement programme notice (separate WC line; search
    snippet)
  url: https://www.contractsfinder.service.gov.uk/Notice/17827971-84e2-4670-ac4a-6c13c871fc77
  licence: unknown-copyright-facts-only
  evidence_quality: search_snippet
- source_title: 'Wickes how-to guide: installing a toilet'
  url: https://www.wickes.co.uk/how-to-guides/bathrooms/fit-a-toilet
  licence: all-rights-reserved-facts-only
  evidence_quality: retailer
- source_title: 'A Decent Home: definition and guidance (DCLG, June 2006)'
  url: https://assets.publishing.service.gov.uk/media/5a7968b740f0b63d72fc5926/138355.pdf
  licence: OGL-3.0
  evidence_quality: public_spec
variants:
  wc_type:
    type: enum
    question: WC type?
    values:
    - close_coupled
    - wall_hung
    default: close_coupled
  soil_outlet:
    type: enum
    question: Where does the soil pipe leave the pan position?
    values:
    - horizontal
    - vertical
    default: horizontal
  wall_type:
    type: enum
    question: Main wall construction where fittings are fixed?
    values:
    - stud
    - solid
    default: solid
  joint_system:
    type: enum
    question: Pipe joint system for new pipework?
    values:
    - compression
    - push_fit
    - solder
    default: compression
inputs:
  sealant_joint_m:
    unit: m
    description: Sealant joint length around the pan and cistern.
    sample: '1.5'
  pipe_15mm_m:
    unit: m
    description: New 15 mm supply pipe run.
    sample: '1'
  paint_wall_m2:
    unit: m2
    description: Wall area to make good and paint.
    sample: '3'
  paint_ceiling_m2:
    unit: m2
    description: Ceiling area to paint (usually 0).
    sample: '0'
derived:
  sealant_m_per_cartridge:
    formula: sealant_cartridge_ml / (sealant_joint_width_mm * sealant_joint_depth_mm)
    unit: m
    description: Bead length per cartridge (ml / mm2 gives metres).
  paint_litres:
    formula: (paint_wall_m2 + paint_ceiling_m2) * (emulsion_finish_coats + emulsion_mist_coats) / emulsion_coverage_m2_per_l
    unit: l
    description: Emulsion litres (area x coats / spreading rate).
groups:
