      licence: unknown-copyright-facts-only
      evidence_quality: derived
      derived_from: 'Walsall strip-out item: isolate, disconnect, remove fittings and cart away. One cap
        per disconnected feed (count assumed).'
    - source_title: Toolstation plumbing category tree
      url: https://www.toolstation.com/plumbing/c3
      licence: unknown-copyright-facts-only
      evidence_quality: retailer
