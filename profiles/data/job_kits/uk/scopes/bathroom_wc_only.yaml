# WC replacement
# synthetic/illustrative seed — not licensed data; tradesperson review required
# Plain data: edit it directly. Schema and licensing policy: profiles/data/job_kits/README.md.
# Checked by tests/profiles/test_job_kits*.py and tests/job_kits/. Line wording is our own; brand
# names appear only in example_note fields. Provenance URLs are sources read in
# research_notes/UK refurbishment job templates data/ and research_notes/UK
# refurbishment top picks by option/ (2026-10-06).
id: uk.bathroom.wc_only
scope_id: bathroom_wc_only
job_type: bathroom
scope: wc_only
replaces: uk.wc_replacement
version: 0.3.0
market: uk
title: WC replacement
label: synthetic/illustrative seed — not licensed data; tradesperson review required
status: needs_tradesperson_review
review:
  owner: null
  reviewed_by: null
  reviewed_on: null
  note: Not reviewed. A named owner and a UK tradesperson must review every line, quantity and rule before
    any customer use.
description: Replace one WC like for like (close-coupled) or with a wall-hung pan on a concealed frame.
  Separate WC replacement is its own line in council kitchen and bathroom programmes.
assumption_source: default_template
uniclass_ss:
- code: Ss_40_15_75_97
  title: WC systems
  version: Ss v1.43 (July 2026)
job_provenance:
- source_title: LB Hillingdon kitchen and bathroom replacement programme notice (separate WC line; search
    snippet)
  url: https://www.contractsfinder.service.gov.uk/Notice/17827971-84e2-4670-ac4a-6c13c871fc77
  licence: unknown-copyright-facts-only
  evidence_quality: search_snippet
- source_title: 'Wickes how-to guide: installing a toilet'
  url: https://www.wickes.co.uk/how-to-guides/bathrooms/fit-a-toilet
  licence: all-rights-reserved-facts-only
  evidence_quality: retailer
- source_title: 'A Decent Home: definition and guidance (DCLG, June 2006)'
  url: https://assets.publishing.service.gov.uk/media/5a7968b740f0b63d72fc5926/138355.pdf
  licence: OGL-3.0
  evidence_quality: public_spec
questions:
- id: wc_type
  ask: upfront
  reason_upfront: Close-coupled, back-to-wall or wall-hung changes the pan, cistern, frame or unit and
    boxing lines.
- id: pan_alignment
  ask: upfront
  reason_upfront: Whether the outlet lines up decides a rigid or flexible connector; 'not sure' maps to
    flexible, which fits either way.
- id: wc_height
  ask: upfront
  reason_upfront: Standard or comfort height changes the pan itself and matters for less mobile users.
- id: soil_outlet
  ask: on_review
- id: wall_type
  ask: on_review
- id: joint_system
  ask: on_review
- id: finish_level
  ask: on_review
fixed_answers: {}
measurements: []
allowances:
  sealant_joint_m:
    value: '1.5'
    unit: m
    label: Sealant joint length
    description: Sealant joint length around the pan and cistern.
  pipe_15mm_m:
    value: '1'
    unit: m
    label: 15 mm supply pipe run
    description: New 15 mm supply pipe run.
  paint_wall_m2:
    value: '3'
    unit: m2
    label: Wall area to paint
    description: Wall area to make good and paint.
  paint_ceiling_m2:
    value: '0'
    unit: m2
    label: Ceiling area to paint
    description: Ceiling area to paint (usually 0).
derived: {}
modules:
- module: strip_out
  overrides:
    so_cap_feeds:
      quantity: '1'
    so_remove_fittings:
      description: Disconnect and remove the existing WC
- module: first_fix_plumbing
- module: wc
  overrides:
    sw_wc_pan_connector:
      description: WC pan connector for a horizontal soil outlet
      spec: Pan connector, 110 mm, straight or offset for a horizontal outlet (P trap); rigid where alignment
        allows
      when: wc_type != 'wall_hung' and soil_outlet == 'horizontal' and pan_alignment == 'aligned'
    sw_wc_pan_connector_vertical:
      when: wc_type != 'wall_hung' and soil_outlet == 'vertical' and pan_alignment == 'aligned'
    sw_wc_pan_close_coupled:
      when: wc_type == 'close_coupled' and wc_height == 'standard'
  include_lines:
  - sw_wc_pan_connector_vertical
  - sw_wc_pan_connector_flexible
  - sw_wc_pan_comfort_height
- module: consumables
  overrides:
    cs_clear_sealant_wc:
      when: null
- module: decorating
- module: waste
rules:
- id: pan_connector_horizontal
  when: wc_type != 'wall_hung' and soil_outlet == 'horizontal' and pan_alignment == 'aligned'
  requires:
  - sw_wc_pan_connector
  excludes:
  - sw_wc_pan_connector_vertical
  - sw_wc_pan_connector_flexible
  rationale: 'The connector depends on the soil position: horizontal outlet to P trap.'
  provenance:
  - source_title: Armitage Shanks Contour 21 close-coupled WC suite data sheet
    url: https://www.specifiedby.com/armitage-shanks/contour-21-close-coupled-wc-suite/armitage-shanks_Contour-21-Close-Coupled-WC-Suite_Specifications_DataSheet1.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
- id: pan_connector_vertical
  when: wc_type != 'wall_hung' and soil_outlet == 'vertical' and pan_alignment == 'aligned'
  requires:
  - sw_wc_pan_connector_vertical
  excludes:
  - sw_wc_pan_connector
  - sw_wc_pan_connector_flexible
  rationale: 'The connector depends on the soil position: S or turned P trap.'
  provenance:
  - source_title: Armitage Shanks Contour 21 close-coupled WC suite data sheet
    url: https://www.specifiedby.com/armitage-shanks/contour-21-close-coupled-wc-suite/armitage-shanks_Contour-21-Close-Coupled-WC-Suite_Specifications_DataSheet1.pdf
    licence: manufacturer-doc-facts-only
    evidence_quality: manufacturer_doc
- id: wall_hung_no_pan_connector
  when: wc_type == 'wall_hung'
  excludes:
  - sw_wc_pan_connector
  - sw_wc_pan_connector_vertical
  rationale: Wall-hung frames connect through their own 90/110 mm adaptor whatever the soil position.
  provenance:
  - source_title: Geberit UK catalogue, Duofix frame 111.300.00.5 scope of delivery (search snippet; page
      404 when fetched)
    url: https://catalog.geberit.co.uk/en-GB/product/PRO_100926
    licence: manufacturer-doc-facts-only
    evidence_quality: search_snippet
  - source_title: Grohe Rapid SL 3-in-1 set 3886020A component list (QS Supplies retailer page)
    url: https://qssupplies.co.uk/bathroom-furniture-shower-taps/321819.htm
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
- id: close_coupled_consumables
  when: wc_type == 'close_coupled'
  requires:
  - cs_wc_packers
  - cs_clear_sealant_wc
  - cs_thread_sealant
  rationale: Pan installation needs packers, silicone and PTFE.
  provenance:
  - source_title: 'Wickes how-to guide: installing a toilet'
    url: https://www.wickes.co.uk/how-to-guides/bathrooms/fit-a-toilet
    licence: all-rights-reserved-facts-only
    evidence_quality: retailer
- id: back_to_wall_consumables
  when: wc_type == 'back_to_wall'
  requires:
  - cs_wc_packers
  - cs_clear_sealant_wc
  - cs_thread_sealant
  rationale: 'A back-to-wall pan is floor-fixed like a close-coupled pan: packers, silicone and PTFE.'
  provenance:
  - source_title: Wickes Siena bathroom range (close-coupled or back-to-wall pan, 500 mm basins)
    url: https://www.wickes.co.uk/bathroom/suites/siena
    licence: all-rights-reserved-facts-only
    evidence_quality: retailer
- id: pan_connector_offset
  when: wc_type != 'wall_hung' and pan_alignment == 'offset'
  requires:
  - sw_wc_pan_connector_flexible
  excludes:
  - sw_wc_pan_connector
  - sw_wc_pan_connector_vertical
  rationale: Where the outlet is offset or its position is not known, a flexible connector replaces the
    rigid one.
  provenance:
  - source_title: Screwfix pan connectors category (rigid and flexible prices, search snippet)
    url: https://www.screwfix.com/c/bathrooms-kitchens/pan-connectors/cat2330023
    licence: unknown-copyright-facts-only
    evidence_quality: search_snippet
  - source_title: Screwfix flexible straight adjustable WC connector (search snippet, Oct 2026)
    url: https://www.screwfix.com/p/mcalpine-flexible-straight-adjustable-wc-connector-white-330-850mm/149CL
    licence: unknown-copyright-facts-only
    evidence_quality: search_snippet
- id: close_coupled_wc
  when: wc_type == 'close_coupled'
  requires:
  - sw_wc_cistern
  - sw_wc_seat
  - sw_wc_flush_lever
  - ff_iv_wc
  excludes:
  - sw_wc_frame
  - sw_wc_flush_plate
  - sw_wc_pan_wall_hung
  rationale: A close-coupled WC needs a pan of the chosen height, its cistern, seat, flush lever and an
    isolating valve; no frame.
  provenance:
  - source_title: Victorian Plumbing close-coupled toilet buying guide and category counts (viewed Oct
      2026)
    url: https://www.victorianplumbing.co.uk/buying-guides/toilets/close-coupled-toilets
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: Bathroom Mountain guide to toilet heights
    url: https://www.bathroommountain.co.uk/inspiration-and-advice/toilet-heights
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
- id: wc_height_standard
  when: wc_type == 'close_coupled' and wc_height == 'standard'
  requires:
  - sw_wc_pan_close_coupled
  excludes:
  - sw_wc_pan_comfort_height
  rationale: A standard-height close-coupled WC uses the standard pan.
  provenance:
  - source_title: Bathroom Mountain guide to toilet heights
    url: https://www.bathroommountain.co.uk/inspiration-and-advice/toilet-heights
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
- id: wc_height_comfort
  when: wc_type == 'close_coupled' and wc_height == 'comfort'
  requires:
  - sw_wc_pan_comfort_height
  excludes:
  - sw_wc_pan_close_coupled
  rationale: A comfort-height close-coupled WC uses the comfort-height pan.
  provenance:
  - source_title: Bathroom Mountain guide to toilet heights
    url: https://www.bathroommountain.co.uk/inspiration-and-advice/toilet-heights
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
  - source_title: 'Durovin Bathrooms: is a comfort height toilet right for me'
    url: https://www.durovinbathrooms.co.uk/blog/post/is-a-comfort-height-toilet-right-for-me
    licence: unknown-copyright-facts-only
    evidence_quality: retailer
