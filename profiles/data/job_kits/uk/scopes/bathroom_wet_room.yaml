    unit: m2
    label: Backer board area
    description: Wall area to line with tile backer board.
  sealant_joint_m:
    value: '6'
    unit: m
    label: Sealant joint length
    description: Total sealant joint length.
  pipe_15mm_m:
    value: '10'
    unit: m
    label: 15 mm supply pipe run
    description: New 15 mm supply pipe run.
  waste_32mm_m:
    value: '2'
    unit: m
    label: 32 mm waste run
    description: New 32 mm basin waste run.
  waste_gully_m:
    value: '3'
    unit: m
    label: Gully waste run
    description: Waste run from the gully to the stack or pump.
  shower_cable_run_m:
    value: '12'
    unit: m
    label: Shower cable run
    description: Shower circuit cable run (electric shower only).
  fan_cable_run_m:
    value: '6'
    unit: m
    label: Fan cable run
