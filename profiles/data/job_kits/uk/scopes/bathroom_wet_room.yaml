derived:
  tanked_m2:
    formula: floor_m2 + shower_wall_tanked_m2
    unit: m2
    description: 'Area to tank: whole floor plus shower walls.'
modules:
- module: strip_out
  overrides:
    so_remove_fittings:
      description: Disconnect and remove the existing bath or tray, basin, WC, radiator and fittings
- module: partition
  when: layout_change
- module: floor_drainage
- module: first_fix_plumbing
- module: electrics
- module: waterproofing
- module: tiling
  overrides:
    tl_floor_tiles:
      spec: Slip-resistant floor tiles suited to a wet-room floor laid to falls; slip rating set by the
        specifier
- module: flooring
  include_lines:
  - fl_vinyl_trim
- module: adaptations
- module: heating
  when: replace_radiator
- module: wc
  overrides:
    sw_wc_pan_close_coupled:
      spec: Floor-standing close-coupled WC pan, horizontal outlet, with floor fixing kit; pan height
        at least {accessible_wc_pan_min_height_mm} mm where M4(3) applies; avoid a side outlet so a wheeled
        commode fits
      provenance:
      - source_title: Armitage Shanks Contour 21 close-coupled WC suite data sheet
        url: https://www.specifiedby.com/armitage-shanks/contour-21-close-coupled-wc-suite/armitage-shanks_Contour-21-Close-Coupled-WC-Suite_Specifications_DataSheet1.pdf
        licence: manufacturer-doc-facts-only
        evidence_quality: manufacturer_doc
      - source_title: Bathroom specification - bathroom replacement for general needs dwellings, V1 24.11.2025
          (Sell2Wales tender attachment)
        url: https://www.sell2wales.gov.wales/Assets/NoticeBuilder_FileDownload.aspx?id=376193
        licence: unknown-copyright-facts-only
        evidence_quality: public_spec
      - source_title: Approved Document M Vol 1, 2015 incl. 2016 amendments
        url: https://assets.publishing.service.gov.uk/media/5a7f8a82ed915d74e622b17b/BR_PDF_AD_M1_2015_with_2016_amendments_V3.pdf
        licence: OGL-3.0
        evidence_quality: standard
      - source_title: Nottinghamshire County Council level access shower factsheet
        url: https://www.nottinghamshire.gov.uk/media/1731835/levelaccessshowerfactsheet.pdf
        licence: unknown-copyright-facts-only
        evidence_quality: public_spec
    sw_wc_flush_lever:
      spec: Flush actuator to suit the cistern; on the front of the cistern on the transfer side (M4(3))
      provenance:
      - source_title: Armitage Shanks Contour 21 close-coupled WC suite data sheet
        url: https://www.specifiedby.com/armitage-shanks/contour-21-close-coupled-wc-suite/armitage-shanks_Contour-21-Close-Coupled-WC-Suite_Specifications_DataSheet1.pdf
        licence: manufacturer-doc-facts-only
        evidence_quality: manufacturer_doc
      - source_title: Approved Document M Vol 1, 2015 incl. 2016 amendments
        url: https://assets.publishing.service.gov.uk/media/5a7f8a82ed915d74e622b17b/BR_PDF_AD_M1_2015_with_2016_amendments_V3.pdf
        licence: OGL-3.0
        evidence_quality: standard
    sw_wc_flush_plate:
      spec: Flush plate from the same maker and series as the concealed cistern; on the front of the cistern
        on the transfer side (M4(3))
      provenance:
      - source_title: Grohe Rapid SL 3-in-1 set 3886020A component list (QS Supplies retailer page)
        url: https://qssupplies.co.uk/bathroom-furniture-shower-taps/321819.htm
        licence: unknown-copyright-facts-only
        evidence_quality: retailer
      - source_title: Geberit UK catalogue, Duofix frame 111.300.00.5 scope of delivery (search snippet;
          page 404 when fetched)
        url: https://catalog.geberit.co.uk/en-GB/product/PRO_100926
        licence: manufacturer-doc-facts-only
        evidence_quality: derived
        derived_from: Plate is not in the frame's scope list; the note infers it is a separate purchase.
      - source_title: Approved Document M Vol 1, 2015 incl. 2016 amendments
        url: https://assets.publishing.service.gov.uk/media/5a7f8a82ed915d74e622b17b/BR_PDF_AD_M1_2015_with_2016_amendments_V3.pdf
        licence: OGL-3.0
        evidence_quality: standard
    sw_wc_pan_wall_hung:
      spec: Wall-hung WC pan to suit the frame fixing centres; pan height at least {accessible_wc_pan_min_height_mm}
        mm where M4(3) applies; avoid a side outlet so a wheeled commode fits
      provenance:
      - source_title: Grohe Rapid SL 3-in-1 set 3886020A component list (QS Supplies retailer page)
        url: https://qssupplies.co.uk/bathroom-furniture-shower-taps/321819.htm
        licence: unknown-copyright-facts-only
        evidence_quality: retailer
      - source_title: Geberit UK catalogue, Duofix frame 111.300.00.5 scope of delivery (search snippet;
          page 404 when fetched)
        url: https://catalog.geberit.co.uk/en-GB/product/PRO_100926
        licence: manufacturer-doc-facts-only
        evidence_quality: search_snippet
      - source_title: Approved Document M Vol 1, 2015 incl. 2016 amendments
        url: https://assets.publishing.service.gov.uk/media/5a7f8a82ed915d74e622b17b/BR_PDF_AD_M1_2015_with_2016_amendments_V3.pdf
        licence: OGL-3.0
        evidence_quality: standard
      - source_title: Nottinghamshire County Council level access shower factsheet
        url: https://www.nottinghamshire.gov.uk/media/1731835/levelaccessshowerfactsheet.pdf
        licence: unknown-copyright-facts-only
        evidence_quality: public_spec
- module: basin
  overrides:
    sw_basin_wall_hung:
      spec: Wall-hung ceramic washbasin with concealed brackets or fixing clamps, rim {accessible_basin_rim_min_mm}-{accessible_basin_rim_max_mm}
        mm above floor where M4(3) applies
    sw_basin_taps:
      spec: Lever-handled basin taps or mixer for limited grip
      provenance:
      - source_title: Nottinghamshire County Council level access shower factsheet
        url: https://www.nottinghamshire.gov.uk/media/1731835/levelaccessshowerfactsheet.pdf
        licence: unknown-copyright-facts-only
        evidence_quality: public_spec
      - source_title: Walsall Council DFG specification, adapted bathroom - low level tray (Feb 2015)
        url: https://go.walsall.gov.uk/sites/default/files/2022-08/specification_for_dfg_low_level_tray-3.pdf
        licence: unknown-copyright-facts-only
        evidence_quality: public_spec
- module: shower
  overrides:
    sh_electric_unit:
      spec: Electric shower, rating per the shower_kw answer, mains cold feed only, 15 mm inlet; controls
        at about {shower_control_height_mm} mm, riser reaching low for seated use
    sh_mixer_valve:
      spec: Thermostatic bar valve, {shower_valve_inlet_centres_mm} mm inlet centres with offset connectors,
        rated for the household water system pressure; controls at about {shower_control_height_mm} mm,
        riser reaching low for seated use
- module: ventilation
  include_lines:
  - vn_humidistat_control
- module: consumables
- module: decorating
- module: waste
rules:
- id: wet_room_basin
  requires:
  - sw_basin_wall_hung
  - ad_blending_valve
  rationale: M4(3) basins are wall-hung; lever taps help limited grip; basin hot water is blended in the
    DFG spec cited.
  provenance:
  - source_title: Approved Document M Vol 1, 2015 incl. 2016 amendments
    url: https://assets.publishing.service.gov.uk/media/5a7f8a82ed915d74e622b17b/BR_PDF_AD_M1_2015_with_2016_amendments_V3.pdf
    licence: OGL-3.0
    evidence_quality: standard
  - source_title: Nottinghamshire County Council level access shower factsheet
    url: https://www.nottinghamshire.gov.uk/media/1731835/levelaccessshowerfactsheet.pdf
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
  - source_title: Walsall Council DFG specification, adapted bathroom - low level tray (Feb 2015)
    url: https://go.walsall.gov.uk/sites/default/files/2022-08/specification_for_dfg_low_level_tray-3.pdf
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
- id: floor_tiled
  when: floor_finish == 'tiled'
  requires:
  - tl_floor_tiles
  - tl_floor_adhesive
  - tl_floor_grout
  excludes:
  - fl_safety_vinyl
  - fl_weld_rod
  - fl_vinyl_trim
  rationale: A tiled floor needs tiles, adhesive and grout and no sheet vinyl.
  provenance:
  - source_title: 'Wickes how-to guide: tiling a wall'
    url: https://www.wickes.co.uk/how-to-guides/tiling/tile-a-wall
    licence: all-rights-reserved-facts-only
    evidence_quality: retailer
- id: floor_sheet_vinyl
  when: floor_finish == 'sheet_vinyl'
  requires:
  - fl_safety_vinyl
  - fl_weld_rod
  - fl_vinyl_trim
  excludes:
  - tl_floor_tiles
  - tl_floor_adhesive
  - tl_floor_grout
  rationale: Sheet vinyl is welded and sealed to sanitaryware; no floor tiles.
  provenance:
  - source_title: Walsall Council DFG specification, adapted bathroom - low level tray (Feb 2015)
    url: https://go.walsall.gov.uk/sites/default/files/2022-08/specification_for_dfg_low_level_tray-3.pdf
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
  - source_title: Bathroom specification - bathroom replacement for general needs dwellings, V1 24.11.2025
      (Sell2Wales tender attachment)
    url: https://www.sell2wales.gov.wales/Assets/NoticeBuilder_FileDownload.aspx?id=376193
    licence: unknown-copyright-facts-only
    evidence_quality: public_spec
