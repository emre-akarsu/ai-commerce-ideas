    description: Tile thickness.
  grout_joint_mm:
    value: '3'
    unit: mm
    label: Grout joint width
    description: Grout joint width.
  adhesive_notch_mm:
    value: '6'
    unit: mm
    label: Trowel notch depth
    description: Trowel notch depth.
  tile_trim_m:
    value: '5'
