  fan_duct_run_m:
    value: '3'
    unit: m
    label: Fan duct run
    description: Fan duct run.
  partition_length_m:
    value: '1.8'
    unit: m
    label: Partition length
    description: Length of new stud partition (0 if none).
  partition_faces:
    value: '2'
    unit: nr
    label: Partition faces to board
    description: Faces of the partition to board (1 or 2).
  tile_length_cm:
    value: '30'
    unit: cm
