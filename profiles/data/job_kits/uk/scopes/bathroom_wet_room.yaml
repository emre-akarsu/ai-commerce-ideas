# Wet room / level-access shower conversion
# synthetic/illustrative seed — not licensed data; tradesperson review required
# Plain data: edit it directly. Schema and licensing policy: profiles/data/job_kits/README.md.
# Checked by tests/profiles/test_job_kits*.py and tests/job_kits/. Line wording is our own; brand
# names appear only in example_note fields. Provenance URLs are sources read in
# research_notes/UK refurbishment job templates data/ (2026-10-06).
id: uk.bathroom.wet_room
scope_id: bathroom_wet_room
job_type: bathroom
scope: wet_room
replaces: uk.wet_room
version: 0.2.0
market: uk
title: Wet room / level-access shower conversion
label: synthetic/illustrative seed — not licensed data; tradesperson review required
status: needs_tradesperson_review
review:
  owner: null
  reviewed_by: null
  reviewed_on: null
  note: Not reviewed. A named owner and a UK tradesperson must review every line, quantity and rule before
    any customer use.
description: 'Replace a bath with a level-access shower in a wet room: former and gully laid to falls,
  tanked floor and shower walls, slip-resistant floor, grab rails, WC and wall-hung basin. Structure follows
  one council DFG level-access specification; requirement items follow Approved Document M (M4(3) where
  it applies) and council OT guidance.'
assumption_source: default_template
uniclass_ss:
- code: Ss_40_15_75_78
  title: Shower area systems
  version: Ss v1.43 (July 2026)
- code: Ss_40_15_75_02
  title: Accessible WC package systems
  version: Ss v1.43 (July 2026)
job_provenance:
- source_title: Walsall Council DFG specification, adapted bathroom - low level tray (Feb 2015)
  url: https://go.walsall.gov.uk/sites/default/files/2022-08/specification_for_dfg_low_level_tray-3.pdf
  licence: unknown-copyright-facts-only
  evidence_quality: public_spec
- source_title: Approved Document M Vol 1, 2015 incl. 2016 amendments
  url: https://assets.publishing.service.gov.uk/media/5a7f8a82ed915d74e622b17b/BR_PDF_AD_M1_2015_with_2016_amendments_V3.pdf
  licence: OGL-3.0
  evidence_quality: standard
- source_title: 'North Norfolk DC advice sheet: accessible bathrooms (self-funded DFG adaptations)'
  url: https://www.north-norfolk.gov.uk/media/9723/advice-sheet-for-adapting-bathrooms.pdf
  licence: unknown-copyright-facts-only
  evidence_quality: public_spec
- source_title: Nottinghamshire County Council level access shower factsheet
  url: https://www.nottinghamshire.gov.uk/media/1731835/levelaccessshowerfactsheet.pdf
  licence: unknown-copyright-facts-only
  evidence_quality: public_spec
