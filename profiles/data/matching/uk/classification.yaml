# Verified classification codes the matching component may store.
#
# Only codes read live (Uniclass taxon pages, buildingSMART bSDD API) on 2026-10-06 and recorded in
# research_notes/UK refurbishment job templates data/classification_standards.md are listed here.
# Titles are stored verbatim. Nothing is edited, merged or extended: Uniclass 2015 is CC BY-ND 4.0.
# A code that is not in this file is rejected by the ontology loader and the ontology writer, so a
# model-proposed entry can never introduce an invented classification (hard rule 3).
# Whether serving these codes next to our own attributes is an "adapted work" under CC BY-ND is an
# open legal question (see the notes, section 6 Gaps).
