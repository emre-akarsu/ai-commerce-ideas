# UK trade lexicon for the matching engine: noise words, abbreviations, count and pack words.
# Synthetic/illustrative seed written from UK trade usage in the repo's research notes; every
# entry is unreviewed (status below). Words that carry a specification (standard, flexible,
# white, MR, S1, C16 ...) must never be noise words: a test enforces that.
status: needs_tradesperson_review
provenance:
  - {kind: research_note, ref: "research_notes/UK refurbishment top picks by option/boards_framing_fixings.md", note: "TE, MR, CLS, 38x63 and screw notation as used by UK merchants"}
  - {kind: research_note, ref: "research_notes/UK refurbishment top picks by option/plumbing_fittings_wastes.md", note: "compression, push-fit, solvent weld, pan connector wording"}
  - {kind: authored, ref: "profiles/data/job_kits/uk/modules", note: "kit line wording"}
noise_words:
  - the
  - a
  - an
  - and
  - or
  - of
  - for
  - with
  - to
  - in
  - "on"
  - at
  - by
  - from
  - please
  - pls
  - plz
  - thanks
  - thx
  - supply
  - supplied
  - deliver
  - delivery
  - need
  - needed
  - require
  - required
  - req
  - urgent
  - asap
  - new
  - good
  - quality
  - approx
  - approximately
  - about
  - item
  - qty
  - quantity
  - size
  - type
  - each
  - per
  - "off"
  - "no"
  - nr
  - pack
  - box
  - bag
  - roll
  - bathroom
  - kitchen
  - room
  - job
  - site
  - trade
# Token (lowercase, as typed) -> words it stands for. Applied to order lines, catalogue titles and
# ontology phrases alike, so both sides of every comparison are expanded the same way.
