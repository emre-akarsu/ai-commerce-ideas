        required: true
        check: class
        question: "Alkali-resistant glass-fibre mesh or paper tape?"
        values:
          glass_fibre_ar: {label: alkali-resistant glass fibre mesh, synonyms: [alkali resistant glass fibre mesh, alkali resistant glass fibre, alkali resistant mesh, glass fibre mesh, glass fiber mesh]}
          paper: {label: paper, synonyms: [paper, paper tape]}
      - {name: width, label: tape width, kind: numeric, unit: mm, required: true, check: size, min: 20, max: 300, aliases: [wide, width]}
      - {name: length, label: roll length, kind: numeric, unit: mm, required: true, check: size, min: 1000, max: 100000, aliases: [long, length]}

