# Support products that the bathroom job kits ask for and the first ontology seed did not model:
# clips, spacers, mesh tape, backer screws, floor overlay board, levelling compound, bath fittings,
# cisterns, seats and accessories. Synthetic/illustrative seed: every entry needs a tradesperson's
# review. Added so each kit line that names ONE product has a type to resolve to; assortment and
# "to suit" lines deliberately have no type (they stay review items). Attribute sets are small and
# invented for this seed, not taken from a licensed product-data standard.
file: kit_support
types:
  pipe_clip:
    label: pipe clip
    status: needs_tradesperson_review
    provenance: &kit_prov
      - {kind: authored, ref: "profiles/data/job_kits/uk/modules", note: "kit line wording; synthetic attribute set for the seed catalogue"}
    synonyms: [pipe clip, pipe clips, pipe saddle, pipe saddles]
    vocab: [clip, clips, saddle, saddles]
    attributes:
      - {name: diameter, label: pipe size, kind: numeric, unit: mm, required: true, check: size, min: 8, max: 54, aliases: [diameter, pipe]}
      - name: material
        label: clip material
        kind: enum
        required: true
        check: class
        question: "Plastic or copper clips?"
        values:
          plastic: {label: plastic, synonyms: [plastic, polypropylene]}
          copper: {label: copper, synonyms: [copper]}
      - {name: pack_qty, label: pack quantity, kind: numeric, unit: nr, required: false, check: pack, min: 1, max: 1000, aliases: [pack]}

  tile_spacer:
    label: tile spacer
    status: needs_tradesperson_review
    provenance: *kit_prov
    synonyms: [tile spacer, tile spacers, spacer, spacers]
    vocab: [joint, gap]
    attributes:
      - {name: size, label: joint width, kind: numeric, unit: mm, required: true, check: size, min: 1, max: 10, aliases: [joint, gap, spacer]}
      - {name: pack_qty, label: pack quantity, kind: numeric, unit: nr, required: false, check: pack, min: 1, max: 5000, aliases: [pack]}

  joint_tape:
