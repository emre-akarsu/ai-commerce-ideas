# Sanitaryware, showers, taps and towel rails. Synthetic/illustrative seed: every entry needs a
# tradesperson's review.
file: sanitaryware
types:
  wc:
    label: WC
    status: needs_tradesperson_review
    provenance: &san_prov
      - {kind: research_note, ref: "research_notes/UK refurbishment top picks by option/sanitaryware.md", note: "close-coupled rimless soft-close as the UK default; back-to-wall and wall-hung as variants"}
      - {kind: authored, ref: "profiles/data/job_kits/uk/modules/wc.yaml", note: "kit line wording"}
      - {kind: classification_table, ref: "research_notes/UK refurbishment job templates data/classification_standards.md", note: "codes stored verbatim"}
    synonyms: [wc, toilet, toilet pan, wc pan, wc suite, toilet suite, lavatory]
    vocab: [pan, suite, cistern, seat, dual, flush, close, coupled, bowl]
    uniclass_pr: {code: Pr_40_20_93_94, title: WC pans}
    etim_class: {code: EC011289, title: Toilet bowl/pan}
    attributes:
      - name: construction
        label: WC construction
        kind: enum
        required: true
        check: class
        question: "Close-coupled, back-to-wall or wall-hung WC?"
        values:
          close_coupled: {label: close coupled, synonyms: [close coupled]}
          back_to_wall: {label: back to wall, synonyms: [back to wall]}
          wall_hung: {label: wall hung, synonyms: [wall hung, wall mounted]}
      - name: outlet
        label: outlet
        kind: enum
        required: false
        check: class
        values:
          horizontal: {label: horizontal outlet, synonyms: [horizontal, horizontal outlet, p trap]}
          vertical: {label: vertical outlet, synonyms: [vertical, vertical outlet, s trap]}
      - name: rim
        label: rim
        kind: enum
        required: false
        check: class
        values:
          rimless: {label: rimless, synonyms: [rimless]}
          rimmed: {label: rimmed, synonyms: [rimmed, open rim]}
      - name: seat
        label: seat
        kind: enum
        required: false
        check: class
        values:
          soft_close: {label: soft-close seat, synonyms: [soft close]}
          standard_seat: {label: standard seat, synonyms: [standard seat]}
          no_seat: {label: no seat, synonyms: [no seat, without seat, pan only]}
      - name: height
        label: pan height
        kind: enum
        required: false
        check: class
        values:
          standard: {label: standard height, synonyms: [standard height]}
          comfort: {label: comfort height, synonyms: [comfort height, comfort, raised height]}

