# Ventilation, lighting and electrical accessories. Synthetic/illustrative seed: every entry needs a
# tradesperson's (and for electrics, a registered electrician's) review. No verified Uniclass or
# ETIM code was found for any product here, so none is stored (hard rule 3).
file: ventilation_electrics
types:
  extractor_fan:
    label: extractor fan
    status: needs_tradesperson_review
    provenance: &vent_prov
      - {kind: research_note, ref: "research_notes/UK refurbishment top picks by option/electrics_ventilation_and_defaults_ux.md", note: "100 mm axial fan with timer or humidistat; 15 l/s intermittent per Approved Document F"}
      - {kind: authored, ref: "profiles/data/job_kits/uk/modules/ventilation.yaml", note: "kit line wording"}
    synonyms: [extractor fan, extract fan, bathroom fan, bathroom extractor, extractor, axial fan, dmev fan, inline fan, fan]
    vocab: [axial, bathroom, ceiling, wall, spigot, dmev, continuous]
    attributes:
      - {name: duct_diameter, label: duct diameter, kind: numeric, unit: mm, required: true, check: size, min: 80, max: 200, aliases: [duct, diameter, spigot]}
      - name: control
        label: fan control
        kind: enum
        required: true
        check: class
        question: "Basic, timer, humidistat with timer, or pull cord fan?"
        values:
          basic: {label: basic, synonyms: [basic, no timer, without timer]}
          timer: {label: overrun timer, synonyms: [timer, overrun, run on]}
          humidistat_timer: {label: humidistat and timer, synonyms: [humidistat, humidity, humidistat timer, humidistat and timer, humidistat overrun timer, humidistat and overrun timer, timer and humidistat, timer humidistat]}
          pull_cord: {label: pull cord, synonyms: [pull cord]}
      - {name: flow, label: extract rate, kind: numeric, unit: l/s, required: false, rule: ge, check: size, min: 1, max: 200, aliases: [rate, flow]}
      - name: supply
        label: electrical supply
        kind: enum
        required: false
        check: class
        values:
          mains: {label: mains voltage, synonyms: [mains, 230v, 240v]}
          selv: {label: SELV low voltage, synonyms: [selv, 12v, low voltage]}

