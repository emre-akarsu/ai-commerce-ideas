[project]
name = "purchasing-agent"
version = "0.0.1"
description = "MRO parts identification and sourcing agent (R0 vertical slice)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]
llm = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["aiplat*", "aidb*", "components*", "apps*", "employees*"]

[tool.pytest.ini_options]
testpaths = ["tests", "evals"]
pythonpath = ["packages", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["packages", "apps", "employees", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
